<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Fscyuu的emo小游戏</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #1a1a2e;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .game {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #16213e 0%, #0f3460 50%, #1a1a2e 100%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .card {
    width: min(92vw, 420px);
    max-height: 96vh;
    background: #1e1e30;
    border-radius: 20px;
    border: 2px solid #2a2a4a;
    padding: clamp(10px, 3vw, 20px);
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(6px, 1.5vh, 12px);
    box-shadow: 0 0 60px rgba(100, 200, 255, 0.08);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* 顶部横幅 */
  .banner {
    width: 100%;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: #fff;
    text-align: center;
    padding: clamp(8px, 2vw, 12px);
    border-radius: 10px;
    font-size: clamp(15px, 3.8vw, 18px);
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* 副标题 */
  .subtitle {
    color: #7fdbca;
    font-size: clamp(11px, 2.5vw, 13px);
    opacity: 0.6;
    letter-spacing: 1px;
  }

  /* 角色图片区域 */
  .char-area {
    position: relative;
    width: clamp(120px, 36vw, 170px);
    height: clamp(120px, 36vw, 170px);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .char-area img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    transition: transform 0.15s ease;
    pointer-events: none;
    border: 3px solid rgba(127, 219, 202, 0.3);
    box-shadow: 0 0 30px rgba(127, 219, 202, 0.15);
  }

  .char-area.poked img   { transform: scale(1.08) rotate(-3deg); }
  .char-area.petted img  { transform: scale(1.05) translateY(-3px); }
  .char-area.fed img     { transform: scale(1.08); }
  .char-area.called img  { transform: scale(1.08) rotate(3deg); }
  .char-area.stared img  { transform: scale(1.03); }

  /* 气泡闪光 */
  .sparkle {
    position: absolute;
    pointer-events: none;
    font-size: clamp(14px, 4vw, 20px);
    animation: sparkleUp 0.8s ease-out forwards;
  }
  @keyframes sparkleUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(0.3); }
  }
  @keyframes tearFall {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(140px); }
  }

  /* 状态标签 */
  .phase-tag {
    font-size: clamp(11px, 2.5vw, 13px);
    padding: 3px 12px;
    border-radius: 20px;
    font-weight: 600;
    transition: all 0.4s;
  }
  .phase-tag.emo {
    background: rgba(100, 149, 237, 0.2);
    color: #6495ED;
    border: 1px solid rgba(100, 149, 237, 0.3);
  }
  .phase-tag.happy {
    background: rgba(255, 182, 193, 0.2);
    color: #FFB6C1;
    border: 1px solid rgba(255, 182, 193, 0.3);
  }

  /* 进度条 */
  .progress-wrap {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
  }
  .progress-label {
    color: #aaa;
    font-size: clamp(11px, 2.5vw, 13px);
    white-space: nowrap;
    min-width: 42px;
    transition: color 0.4s;
  }
  .progress-bar {
    flex: 1; height: clamp(10px, 2vh, 14px);
    background: #2a2a4a;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #3a3a5a;
  }
  .progress-fill {
    height: 100%; width: 100%;
    border-radius: 7px;
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s;
  }
  .progress-fill.emo-bar {
    background: linear-gradient(90deg, #4169E1, #6495ED);
  }
  .progress-fill.happy-bar {
    background: linear-gradient(90deg, #FF69B4, #FFB6C1);
  }
  .progress-val {
    font-size: clamp(11px, 2.5vw, 13px);
    font-weight: 600;
    min-width: 36px; text-align: right;
    transition: color 0.4s;
  }
  .progress-val.emo-val { color: #6495ED; }
  .progress-val.happy-val { color: #FFB6C1; }

  /* 对话框 */
  .dialog {
    width: 100%;
    background: #2a2a3e;
    border-radius: 14px;
    padding: clamp(10px, 2.5vw, 14px) clamp(12px, 3vw, 18px);
    min-height: clamp(44px, 10vh, 56px);
    display: flex; align-items: center;
    position: relative;
    border: 1px solid #3a3a5a;
  }
  .dialog::before {
    content: ''; position: absolute; top: -8px; left: 30px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 8px solid #2a2a3e;
  }
  .dialog-text {
    color: #e0e0e0;
    font-size: clamp(13px, 3vw, 15px);
    line-height: 1.5;
    transition: opacity 0.2s;
  }
  .bone-indicator {
    opacity: 0;
    transition: opacity 0.5s;
  }
  .bone-indicator.show { opacity: 0.35; }

  /* 按钮组 */
  .btn-row {
    width: 100%;
    display: flex; gap: clamp(6px, 1.5vw, 10px);
    flex-wrap: wrap; justify-content: center;
  }
  .btn {
    flex: 1 1 auto;
    min-width: clamp(52px, 14vw, 70px);
    padding: clamp(8px, 2vw, 12px) clamp(4px, 1vw, 8px);
    border-radius: 12px;
    border: 2px solid #6495ED;
    background: rgba(100, 149, 237, 0.08);
    color: #6495ED;
    font-size: clamp(12px, 2.8vw, 15px);
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:active, .btn.active {
    background: #6495ED;
    color: #fff;
    transform: scale(0.95);
  }
  /* 开心阶段按钮变粉色 */
  .btn.happy-btn {
    border-color: #FF69B4;
    color: #FF69B4;
    background: rgba(255, 105, 180, 0.08);
  }
  .btn.happy-btn:active, .btn.happy-btn.active {
    background: #FF69B4;
    color: #fff;
  }

  .btn-stare {
    width: min(60%, 180px);
    margin-top: 2px;
  }

  /* 聊天输入 */
  .chat-row {
    width: 100%;
    display: flex; gap: 8px;
    margin-top: 4px;
  }
  .chat-input {
    flex: 1;
    background: #2a2a3e;
    border: 2px solid #3a3a5a;
    border-radius: 12px;
    padding: 10px 14px;
    color: #e0e0e0;
    font-size: clamp(12px, 2.8vw, 14px);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .chat-input:focus { border-color: #7fdbca; }
  .chat-input::placeholder { color: #555; }
  .chat-send {
    padding: 10px 16px;
    border-radius: 12px;
    border: 2px solid #7fdbca;
    background: rgba(127, 219, 202, 0.1);
    color: #7fdbca;
    font-size: clamp(12px, 2.8vw, 14px);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-send:active { background: #7fdbca; color: #1a1a2e; }

  /* 底部提示 */
  .hint {
    color: #555;
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* 涟漪 */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(127, 219, 202, 0.5);
    animation: rippleOut 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleOut {
    0% { width: 10px; height: 10px; opacity: 1; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }

  /* 阶段切换提示 */
  .phase-switch-toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.85);
    color: #FFB6C1;
    padding: 16px 28px;
    border-radius: 16px;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    z-index: 100;
    pointer-events: none;
    animation: toastPop 2s ease forwards;
    text-align: center;
    border: 2px solid rgba(255, 182, 193, 0.4);
  }
  @keyframes toastPop {
    0%   { transform: translate(-50%, -50%) scale(0); }
    15%  { transform: translate(-50%, -50%) scale(1.1); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    80%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
  }
</style>
</head>

  function randomDialog(action) {
    // 连击检测
    if (action === combos.lastAction) {
      combos.count++;
    } else {
      combos.count = 1;
      combos.lastAction = action;
    }

    // 连击 4+ → 特殊彩蛋回复
    if (combos.count >= 4 && Math.random() < 0.6) {
      const list = comboLists[phase][action];
      return list[Math.min(combos.count - 4, list.length - 1)];
    }

    // 60% 概率从聊天对话库抽取
    if (Math.random() < 0.6) {
      const poolMap = {
        pet:   ['comfort','love','default'],
        poke:  ['default','daily','negEmo'],
        feed:  ['food','daily','default'],
        call:  ['name','default','daily'],
        stare: ['love','comfort','name']
      };
      const pool = poolMap[action] || ['default'];
      const cat = pool[Math.floor(Math.random() * pool.length)];
      if (chatReplies[phase][cat]) {
        return randPick(chatReplies[phase][cat]);
      }
    }

    // 根据数值分层
    let tier;
    if (phase === 'emo') {
      tier = value >= 70 ? 'deep' : value >= 30 ? 'mid' : 'light';
    } else {
      tier = value >= 70 ? 'high' : value >= 30 ? 'mid' : 'low';
    }

    const list = dialogs[phase][action][tier];
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastIdx[phase][action]) {
      i = (i + 1) % list.length;
    }
    lastIdx[phase][action] = i;
    return list[i];
  }


  // ── 数值变化 ──
  function changeValue(delta) {
    value = Math.max(0, Math.min(100, value + delta));
    elProgressFill.style.width = value + '%';
    elProgressVal.textContent = value;

    // 检测阶段切换
    if (phase === 'emo' && value <= 0) {
      switchToHappy();
    } else if (phase === 'happy' && value >= 100) {
      showToast('🎉 开心值满啦！小狗超快乐！');
    } else if (phase === 'happy' && value <= 0) {
      switchToEmo();
    }
  }

  function switchToHappy() {
    phase = 'happy';
    value = 0;

    // UI 切换
    elProgressFill.classList.remove('emo-bar');
    elProgressFill.classList.add('happy-bar');
    elProgressFill.style.width = '0%';

    elProgressVal.classList.remove('emo-val');
    elProgressVal.classList.add('happy-val');
    elProgressVal.textContent = '0';

    elProgressLbl.textContent = '开心值';
    elProgressLbl.style.color = '#FFB6C1';

    elPhaseTag.classList.remove('emo');
    elPhaseTag.classList.add('happy');
    elPhaseTag.innerHTML = '🌈 开心！';

    btns.forEach(b => {
      b.classList.add('happy-btn');
    });

    elDialog.style.opacity = '0';
    setTimeout(() => {
      elDialog.textContent = '咦？emo没了！我感觉好开心！';
      elDialog.style.opacity = '1';
    }, 200);

    showToast('✨ emo消散！开心模式开启 ✨');
  }

  // ── 意图检测 ──
  function detectIntent(text, score) {
    if (/[？?]|什么|怎么|为什|谁|哪里|哪儿|哪个|吗|有没有|能不能|可以吗|行不行|好不好|对不对|是不是|啥|咋|咋样|怎么样|如何/.test(text)) return 'question';
    if (/别跑|过来|过来嘛|帮|给|来|去|叫|说|唱|跳|抱|摸|喂|看我|理我/.test(text)) return 'command';
    if (/哈哈|嘻嘻|嘿嘿|汪汪|哦耶|哈哈哈哈|呵呵|嘿嘿嘿/.test(text)) return 'playful';
    if (/喂|在吗|在不在|hello|hi|嗨|嘿|哈喽/.test(text) && text.length < 8) return 'greeting';
    if (score < -1) return 'complain';
    return 'chat';
  }

  // ── 语义打分 ──
  function sentimentScore(text) {
    const raw = normalize(text);
    let score = 0;
    // 否定前缀只翻转正面词（"不开心"→负面），不翻转负面词
    const negPrefix = /不|没|别/.test(raw) && !/对不起|是不是|好不好|会不会|要不要/.test(raw);
    for (const [topic, words] of Object.entries(synNeg)) {
      if (words.some(w => raw.includes(w))) {
        score -= 1;
      }
    }
    for (const [topic, words] of Object.entries(synPos)) {
      if (words.some(w => raw.includes(w))) {
        score += negPrefix ? -1 : 1;
      }
    }
    return score;
  }

  // ── 话题检测 ──
  function detectTopic(text) {
    const raw = normalize(text);
    const all = { ...synNeg, ...synPos };
    const negTopics = Object.keys(synNeg);
    for (const [topic, words] of Object.entries(all)) {
      if (words.some(w => raw.includes(w))) {
        return negTopics.includes(topic) ? 'neg:' + topic : 'pos:' + topic;
      }
    }
    return null;
  }

      confusion: ['迷路了？没事，小狗有敏锐的嗅觉——跟我来！'],
      missSomeone: ['想一个人？那就想吧。想完记得回到当下——当下的你有我呢。'],
      silence: ['沉默也没关系，反正我的尾巴会替我们说话。']
    }
  };

  // ── 强音乐意图检测 ──
  function hasMusicIntent(text) {
    const raw = normalize(text);
    return /孙燕姿|听歌|唱歌|音乐|放歌|播放|耳机|旋律|歌单|单曲循环/.test(raw) ||
           /来[首点]歌|放[首点]|推荐.*歌|什么歌|有没有.*歌/.test(raw);
  }

  // ── 生成回复 ──
  function getChatReply(input) {
    const text = input.toLowerCase().trim();
    const p = phase;
    const s = sentimentScore(text);
    const intent = detectIntent(text, s);
    const topic = detectTopic(text);

    // 更新上下文
    const topicChanged = topic !== chatMemory.lastTopic;
    if (topic) {
      chatMemory.lastTopic = topic;
      // 追踪最近话题（排除重复）
      if (!chatMemory.recentTopics.includes(topic)) {
        chatMemory.recentTopics.push(topic);
        if (chatMemory.recentTopics.length > 5) chatMemory.recentTopics.shift();
      }
    }
    if (s < 0) { chatMemory.negStreak++; chatMemory.posStreak = 0; }
    else if (s > 0) { chatMemory.posStreak++; chatMemory.negStreak = 0; }
    else { chatMemory.negStreak = Math.max(0, chatMemory.negStreak - 1); chatMemory.posStreak = Math.max(0, chatMemory.posStreak - 1); }
    chatMemory.lastSentiment = s < 0 ? 'neg' : s > 0 ? 'pos' : 'neutral';
    chatMemory.history.push(text);
    if (chatMemory.history.length > 8) chatMemory.history.shift();

    // 连续消极加深（4+轮）→ 深度陪伴回复
    const deepNeg = chatMemory.negStreak >= 4;
    // 轻度消极（2-3轮）→ 温和关切
    const mildNeg = chatMemory.negStreak >= 2 && chatMemory.negStreak < 4;

    if (s < 0) {
      if (deepNeg) {
        const deepReplies = p === 'emo'
          ? ['你说的每一句都让我的心沉得更深……但我不走，我还在听。', '悲伤堆在一起，快比小狗高了。但没关系，我当你的梯子。', '够了……来，把头靠着我。就这样，不用说也不用动。', '一次次的难过，像海浪拍岸。我当你的岸，不会退缩。', '我哪儿也不去。你有多emo，我就有多靠近。']
          : ['开心值被你一次次的emo震得快碎了……但我还在。', '别再这样了……我好不容易开心起来，别把我按回去呀。', '就算你一直说伤心的事，我也不会走。只是尾巴垂了一点。'];
        return { text: randPick(deepReplies), sentiment: 'neg' };
      }
      if (mildNeg && p === 'emo') {
        const concernReplies = ['你又在难过了……过来，坐近一点。', '感觉到了，你的心在下雨。我在这儿。', '今天好像不太顺？没关系，小狗的耳朵全开着。'];
        // 有一定概率返回关切回复
        if (Math.random() < 0.35) return { text: randPick(concernReplies), sentiment: 'neg' };
      }
      // 匹配具体伤感主题 → 专属回复
      if (topic && topic.startsWith('neg:')) {
        const cat = topic.slice(4);
        if (negReplies[p] && negReplies[p][cat]) {
          return { text: randPick(negReplies[p][cat]), sentiment: 'neg' };
        }
      }
      return { text: randPick(chatReplies[p].negEmo), sentiment: 'neg' };
    }
    if (s > 0) {
      // 连续积极 → 增加亲密感
      if (chatMemory.posStreak >= 4) {
        return { text: randPick(chatReplies[p].love), sentiment: 'pos' };
      }
      if (chatMemory.posStreak >= 2 && Math.random() < 0.3) {
        return { text: randPick(chatReplies[p].love), sentiment: 'pos' };
      }
      // 音乐意图强匹配 → 优先触发（即使 topic 被其他词抢走）
      if (hasMusicIntent(text) && s >= -1) {
        return { text: randPick(chatReplies[p].music), sentiment: 'pos' };
      }
      if (topic && topic.startsWith('pos:')) {
        const cat = topic.slice(4);
        if (cat === 'eat' || cat === 'food') return { text: randPick(chatReplies[p].food), sentiment: 'pos' };
        if (cat === 'hug' || cat === 'love') return { text: randPick(chatReplies[p].love), sentiment: 'pos' };
        if (cat === 'miss') return { text: randPick(chatReplies[p].love), sentiment: 'pos' };
        if (cat === 'music') return { text: randPick(chatReplies[p].music), sentiment: 'pos' };
        if (cat === 'name') return { text: randPick(chatReplies[p].name), sentiment: 'pos' };
        if (cat === 'daily') return { text: randPick(chatReplies[p].daily), sentiment: 'pos' };
        if (cat === 'hope') return { text: randPick(chatReplies[p].comfort), sentiment: 'pos' };
        if (cat === 'gratitude') return { text: randPick(chatReplies[p].love), sentiment: 'pos' };
        if (cat === 'dream') return { text: randPick(chatReplies[p].comfort), sentiment: 'pos' };
        if (cat === 'warm') return { text: randPick(chatReplies[p].comfort), sentiment: 'pos' };
        if (cat === 'happy') return { text: randPick(chatReplies[p].default), sentiment: 'pos' };
        if (cat === 'cute') return { text: randPick(p === 'emo' ? chatReplies[p].name : chatReplies[p].default), sentiment: 'pos' };
      }
      return { text: randPick(chatReplies[p].default), sentiment: 'pos' };
    }
    // neutral → 根据上下文和意图智能选择
    if (intent === 'greeting') {
      const greetReplies = p === 'emo'
        ? ['嗯……你来了。虽然我不太想说话，但我确实在等你。', '嗨……今天也是emo的一天吗？', '在。虽然乌云在头上，但你来了。']
        : ['嗨！你来啦！开心值已就绪！', '汪汪！看到你太开心了！', '在在在！尾巴已经摇成风扇了！'];
      return { text: randPick(greetReplies), sentiment: 'neutral' };
    }
    if (intent === 'question') {
      const qReplies = p === 'emo'
        ? ['你问得很好……让我想想……', '嗯？我不确定诶。', '你问我？我也想知道答案呢……', '好问题！不过小狗只想安静地待着。', '这个问题让我想起了什么……但说不清。']
        : ['好问题！让我摇摇尾巴想一想……', '你问我？嘿嘿，小狗有时候也有答案哦！', '嗯……让我的大脑转一转——好了，没转出来。', '这个问题有点意思！虽然我不知道答案但很喜欢被问。'];
      return { text: randPick(qReplies), sentiment: 'neutral' };
    }
    // 有历史话题 → 延续话题
    if (chatMemory.lastTopic && Math.random() < 0.45) {
      const continuation = p === 'emo'
        ? ['嗯……继续说呀。', '然后呢？我在听。', '你刚才说的，再讲讲呗～', '嗯嗯，我听着呢。', '还没说完呢，我还在听。']
        : ['然后呢然后呢？我超想知道！', '继续说继续说！尾巴在等！', '嗯嗯，我听得可认真了——虽然耳朵有点趴。', '还有后续吗？你的故事比零食还吸引我。'];
      return { text: randPick(continuation), sentiment: 'neutral' };
    }
    return { text: randPick(chatReplies[p].default), sentiment: 'neutral' };
  }

  function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  const elChatInput = document.getElementById('chatInput');
  const elChatSend  = document.getElementById('chatSend');

  // ── 落泪效果 ──
  function tearRain() {
    const count = 6;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const tear = document.createElement('span');
        tear.textContent = '💧';
        tear.style.cssText = [
          'position:absolute; pointer-events:none; font-size:18px;',
          'animation: tearFall 1.5s ease-in forwards;',
          'left:' + (10 + Math.random() * 70) + '%;',
          'top:' + (-10 - Math.random() * 20) + 'px;'
        ].join('');
        elCharArea.appendChild(tear);
        tear.addEventListener('animationend', () => tear.remove());
      }, i * 150);
    }
  }

  // ── AI 聊天（Cloudflare Worker 中转 → 智谱 GLM-4） ──
  const API_URL = 'https://blue-bonus-e74d.lixiaoxuan54088.workers.dev';
  let aiAvailable = true;
  const elBone = document.getElementById('boneIndicator');
  let aiMemory = [];

  async function sendChat() {
    const msg = elChatInput.value.trim();
    if (!msg) return;
    elChatInput.value = '';

    if (aiAvailable) {
      elChatInput.disabled = true;
      elChatSend.textContent = '...';
      try {
        const system = `你是用户Fscyuu的小狗，你的名字也叫Fscyuu。${phase==='emo'?'她正emo，先接住情绪。':'她开心，一起撒欢。'}她爱听孙燕姿的歌，她不主动提时你别主动提，伤感时别提歌先陪她。说话短（1-2句），温暖拟人直接不鸡汤。`;
        const messages = [...aiMemory, { role: 'user', content: msg }];
        elBone.classList.add('show');
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, system }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const fullReply = data.reply || '';
        if (fullReply) {
          aiMemory.push({ role: 'user', content: msg }, { role: 'assistant', content: fullReply });
          if (aiMemory.length > 4) aiMemory = aiMemory.slice(-4);
          showDialog(fullReply);
          elBone.classList.add('show');
          // 轻量情绪检测 → 数值变化
          const negWords = /难过|伤心|emo|不开心|好累|好烦|好想|讨厌|痛苦|焦虑|害怕|崩溃|孤独|后悔|想哭|失眠|压抑/;
          const posWords = /开心|快乐|哈哈|嘻嘻|喜欢|爱你|谢谢|好棒|加油|温暖|感动/;
          const isNeg = negWords.test(msg), isPos = posWords.test(msg);
          if (isNeg && !isPos) {
            if (phase === 'emo') { changeValue(+5); sparkle('💔'); if (value >= 96) tearRain(); }
            else { changeValue(-5); sparkle('😟'); }
          } else if (isPos && !isNeg) {
            if (phase === 'emo') { changeValue(-3); sparkle('💬'); }
            else { changeValue(+3); sparkle('💬'); }
          } else {
            sparkle('💬');
          }
        }
      } catch { aiAvailable = false; elBone.classList.remove('show'); }
      elChatInput.disabled = false;
      elChatSend.textContent = '发送';
      elChatInput.focus();
      if (aiAvailable) return;
    }

    // 离线模式
    const reply = getChatReply(msg);
    showDialog(reply.text);
    if (reply.sentiment === 'neg') {
      const scale = chatMemory.negStreak >= 3 ? 8 : 5;
      if (phase === 'emo') { changeValue(+scale); sparkle('💔'); if (value >= 96) tearRain(); }
      else { changeValue(-scale); sparkle('😟'); }
    } else if (reply.sentiment === 'pos') {
      const scale = chatMemory.posStreak >= 3 ? 3 : 2;
      if (phase === 'emo') { changeValue(-scale); sparkle(chatMemory.posStreak >= 3 ? '🌟' : '💬'); }
      else { changeValue(+scale); sparkle(chatMemory.posStreak >= 3 ? '🌟' : '💬'); }
    }
  }

  elChatSend.addEventListener('click', sendChat);
  elChatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
  });

  // ── 防止双击缩放 ──
  document.addEventListener('dblclick', function(e) {
    e.preventDefault();
  }, { passive: false });

})();
</script>
</body>
