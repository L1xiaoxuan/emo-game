<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Fscyuu的emo小游戏</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #1a1a2e;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .game {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #16213e 0%, #0f3460 50%, #1a1a2e 100%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .card {
    width: min(92vw, 420px);
    max-height: 96vh;
    background: #1e1e30;
    border-radius: 20px;
    border: 2px solid #2a2a4a;
    padding: clamp(10px, 3vw, 20px);
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(6px, 1.5vh, 12px);
    box-shadow: 0 0 60px rgba(100, 200, 255, 0.08);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* 顶部横幅 */
  .banner {
    width: 100%;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: #fff;
    text-align: center;
    padding: clamp(8px, 2vw, 12px);
    border-radius: 10px;
    font-size: clamp(15px, 3.8vw, 18px);
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* 副标题 */
  .subtitle {
    color: #7fdbca;
    font-size: clamp(11px, 2.5vw, 13px);
    opacity: 0.6;
    letter-spacing: 1px;
  }

  /* 角色图片区域 */
  .char-area {
    position: relative;
    width: clamp(120px, 36vw, 170px);
    height: clamp(120px, 36vw, 170px);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .char-area img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    transition: transform 0.15s ease;
    pointer-events: none;
    border: 3px solid rgba(127, 219, 202, 0.3);
    box-shadow: 0 0 30px rgba(127, 219, 202, 0.15);
  }

  .char-area.poked img   { transform: scale(1.08) rotate(-3deg); }
  .char-area.petted img  { transform: scale(1.05) translateY(-3px); }
  .char-area.fed img     { transform: scale(1.08); }
  .char-area.called img  { transform: scale(1.08) rotate(3deg); }
  .char-area.stared img  { transform: scale(1.03); }

  /* 气泡闪光 */
  .sparkle {
    position: absolute;
    pointer-events: none;
    font-size: clamp(14px, 4vw, 20px);
    animation: sparkleUp 0.8s ease-out forwards;
  }
  @keyframes sparkleUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(0.3); }
  }

  /* 状态标签 */
  .phase-tag {
    font-size: clamp(11px, 2.5vw, 13px);
    padding: 3px 12px;
    border-radius: 20px;
    font-weight: 600;
    transition: all 0.4s;
  }
  .phase-tag.emo {
    background: rgba(100, 149, 237, 0.2);
    color: #6495ED;
    border: 1px solid rgba(100, 149, 237, 0.3);
  }
  .phase-tag.happy {
    background: rgba(255, 182, 193, 0.2);
    color: #FFB6C1;
    border: 1px solid rgba(255, 182, 193, 0.3);
  }

  /* 进度条 */
  .progress-wrap {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
  }
  .progress-label {
    color: #aaa;
    font-size: clamp(11px, 2.5vw, 13px);
    white-space: nowrap;
    min-width: 42px;
    transition: color 0.4s;
  }
  .progress-bar {
    flex: 1; height: clamp(10px, 2vh, 14px);
    background: #2a2a4a;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #3a3a5a;
  }
  .progress-fill {
    height: 100%; width: 100%;
    border-radius: 7px;
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s;
  }
  .progress-fill.emo-bar {
    background: linear-gradient(90deg, #4169E1, #6495ED);
  }
  .progress-fill.happy-bar {
    background: linear-gradient(90deg, #FF69B4, #FFB6C1);
  }
  .progress-val {
    font-size: clamp(11px, 2.5vw, 13px);
    font-weight: 600;
    min-width: 36px; text-align: right;
    transition: color 0.4s;
  }
  .progress-val.emo-val { color: #6495ED; }
  .progress-val.happy-val { color: #FFB6C1; }

  /* 对话框 */
  .dialog {
    width: 100%;
    background: #2a2a3e;
    border-radius: 14px;
    padding: clamp(10px, 2.5vw, 14px) clamp(12px, 3vw, 18px);
    min-height: clamp(44px, 10vh, 56px);
    display: flex; align-items: center;
    position: relative;
    border: 1px solid #3a3a5a;
  }
  .dialog::before {
    content: ''; position: absolute; top: -8px; left: 30px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 8px solid #2a2a3e;
  }
  .dialog-text {
    color: #e0e0e0;
    font-size: clamp(13px, 3vw, 15px);
    line-height: 1.5;
    transition: opacity 0.2s;
  }

  /* 按钮组 */
  .btn-row {
    width: 100%;
    display: flex; gap: clamp(6px, 1.5vw, 10px);
    flex-wrap: wrap; justify-content: center;
  }
  .btn {
    flex: 1 1 auto;
    min-width: clamp(52px, 14vw, 70px);
    padding: clamp(8px, 2vw, 12px) clamp(4px, 1vw, 8px);
    border-radius: 12px;
    border: 2px solid #6495ED;
    background: rgba(100, 149, 237, 0.08);
    color: #6495ED;
    font-size: clamp(12px, 2.8vw, 15px);
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:active, .btn.active {
    background: #6495ED;
    color: #fff;
    transform: scale(0.95);
  }
  /* 开心阶段按钮变粉色 */
  .btn.happy-btn {
    border-color: #FF69B4;
    color: #FF69B4;
    background: rgba(255, 105, 180, 0.08);
  }
  .btn.happy-btn:active, .btn.happy-btn.active {
    background: #FF69B4;
    color: #fff;
  }

  .btn-stare {
    width: min(60%, 180px);
    margin-top: 2px;
  }

  /* 底部提示 */
  .hint {
    color: #555;
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* 涟漪 */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(127, 219, 202, 0.5);
    animation: rippleOut 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleOut {
    0% { width: 10px; height: 10px; opacity: 1; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }

  /* 阶段切换提示 */
  .phase-switch-toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.85);
    color: #FFB6C1;
    padding: 16px 28px;
    border-radius: 16px;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    z-index: 100;
    pointer-events: none;
    animation: toastPop 2s ease forwards;
    text-align: center;
    border: 2px solid rgba(255, 182, 193, 0.4);
  }
  @keyframes toastPop {
    0%   { transform: translate(-50%, -50%) scale(0); }
    15%  { transform: translate(-50%, -50%) scale(1.1); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    80%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
  }
</style>
</head>

        '你的手好温柔呀～转圈圈！',
        '摸头杀有效！开心值暴涨！',
        '嗷呜～舒服得尾巴都要摇断了！',
        '去看一场演唱会开心一下吧！'
      ],
      poke: [
        '哈哈哈！戳到痒痒肉了！',
        '你戳我一下，我戳你一下，嘻嘻～',
        '反弹反弹！你戳到自己啦！',
        '再戳？我舔你手哦！',
        '戳戳戳～好好玩！再来！'
      ],
      feed: [
        '哇！是零食！我爱你！！！',
        '嗷呜一口！好吃好吃好吃！',
        '还有吗还有吗？我还能吃十个！',
        '这是世界上最好吃的鸡肉干！',
        '吃饱了！现在我是世界上最开心的小狗！'
      ],
      call: [
        '到！是你在叫我吗？',
        '来啦来啦！跑着来的！',
        '汪汪！Fscyuu在此！',
        '叫我的名字！再叫一次！',
        '听到名字我的尾巴就开始摇了！'
      ],
      stare: [
        '看我看我！我今天是不是超可爱？',
        '你眼睛里有星星！我眼睛里有你！',
        '输了的人要摸摸赢的人的头！',
        '对视的时候心跳好快……是开心的心跳！',
        '贴贴！贴贴！我要贴贴！'
      ]
    }
  };
  const lastIdx = {
    emo:   { pet: -1, poke: -1, feed: -1, call: -1, stare: -1 },
    happy: { pet: -1, poke: -1, feed: -1, call: -1, stare: -1 }
  };

  function randomDialog(action) {
    const list = dialogs[phase][action];
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastIdx[phase][action]) {
      i = (i + 1) % list.length;
    }
    lastIdx[phase][action] = i;
    return list[i];
  }

  // ── 数值变化 ──
  function changeValue(delta) {
    value = Math.max(0, Math.min(100, value + delta));
    elProgressFill.style.width = value + '%';
    elProgressVal.textContent = value;

    // 检测阶段切换
    if (phase === 'emo' && value <= 0) {
      switchToHappy();
    } else if (phase === 'happy' && value >= 100) {
      showToast('🎉 开心值满啦！小狗超快乐！');
    }
  }

  function switchToHappy() {
    phase = 'happy';
    value = 0;

    // UI 切换
    elProgressFill.classList.remove('emo-bar');
    elProgressFill.classList.add('happy-bar');
    elProgressFill.style.width = '0%';

    elProgressVal.classList.remove('emo-val');
    elProgressVal.classList.add('happy-val');
    elProgressVal.textContent = '0';

    elProgressLbl.textContent = '开心值';
    elProgressLbl.style.color = '#FFB6C1';

    elPhaseTag.classList.remove('emo');
    elPhaseTag.classList.add('happy');
    elPhaseTag.innerHTML = '🌈 开心！';

    btns.forEach(b => {
      b.classList.add('happy-btn');
    });

    elDialog.style.opacity = '0';
    setTimeout(() => {
      elDialog.textContent = '咦？emo没了！我感觉好开心！';
      elDialog.style.opacity = '1';
    }, 200);

    showToast('✨ emo消散！开心模式开启 ✨');
  }

  // ── 气泡文字 ──
  function showDialog(text) {
    elDialog.style.opacity = '0';
    setTimeout(() => {
      elDialog.textContent = text;
      elDialog.style.opacity = '1';
    }, 120);
  }

  // ── 角色动画 ──
  function charAnim(cls) {
    elCharArea.classList.add(cls);
    setTimeout(() => elCharArea.classList.remove(cls), 300);
  }

  // ── 气泡特效 ──
  function sparkle(emoji) {
    const span = document.createElement('span');
    span.className = 'sparkle';
    span.textContent = emoji;
    span.style.left = (30 + Math.random() * 60) + '%';
    span.style.top = (10 + Math.random() * 40) + '%';
    elCharArea.appendChild(span);
    span.addEventListener('animationend', () => span.remove());
  }

  // ── Toast 提示 ──
  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'phase-switch-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    t.addEventListener('animationend', () => t.remove());
  }

  // ── 点击角色 ──
  elCharArea.addEventListener('pointerdown', function(e) {
    const rect = elCharArea.getBoundingClientRect();
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = (e.clientX - rect.left - 5) + 'px';
    ripple.style.top = (e.clientY - rect.top - 5) + 'px';
    elCharArea.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());

    if (phase === 'emo') {
      showDialog('呜……别碰我……');
      changeValue(-2);
      sparkle('💧');
    } else {
      showDialog('汪汪！再摸摸我！');
      changeValue(+2);
      sparkle('✨');
    }
  });

  // ── 按钮点击 ──
  const actions = {
    pet:   { delta_emo: -4, delta_happy: +4, anim: 'petted',  emoji_emo: '😢', emoji_happy: '💕' },
    poke:  { delta_emo: -4, delta_happy: +3, anim: 'poked',   emoji_emo: '💢', emoji_happy: '😂' },
    feed:  { delta_emo: -5, delta_happy: +6, anim: 'fed',     emoji_emo: '🍖', emoji_happy: '🍖' },
    call:  { delta_emo: -3, delta_happy: +3, anim: 'called',  emoji_emo: '🔇', emoji_happy: '📣' },
    stare: { delta_emo: -4, delta_happy: +4, anim: 'stared',  emoji_emo: '🥺', emoji_happy: '🥰' }
  };

  btns.forEach(btn => {
    btn.addEventListener('pointerdown', function(e) {
      e.preventDefault();
    });

    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      const cfg = actions[action];
      if (!cfg) return;

      this.classList.add('active');
      setTimeout(() => this.classList.remove('active'), 150);

      showDialog(randomDialog(action));

      if (phase === 'emo') {
        changeValue(cfg.delta_emo);
        sparkle(cfg.emoji_emo);
      } else {
        changeValue(cfg.delta_happy);
        sparkle(cfg.emoji_happy);
      }

      if (cfg.anim) charAnim(cfg.anim);
    });
  });

  // ── 防止双击缩放 ──
  document.addEventListener('dblclick', function(e) {
    e.preventDefault();
  }, { passive: false });

})();
</script>
</body>
</html>
